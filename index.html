<!doctype html>
<!-- La page d'entrée de l'application : tout commence ici.
     Elle contient plusieurs « écrans » ; un seul est visible à la fois.
     C'est js/app.js qui décide lequel montrer. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Adapte la page à la largeur de l'écran (téléphone ou tablette) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Couleur de la barre du navigateur sur téléphone -->
  <meta name="theme-color" content="#2f6fd6">
  <title>Aventure Éducative</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Si JavaScript est coupé, on le dit gentiment -->
  <noscript>
    <p class="sans-js">Pour jouer, il faut activer JavaScript dans le navigateur.</p>
  </noscript>

  <!-- ===== La barre du haut (visible dès qu'un joueur est choisi) =====
       Le bouton maison est TOUJOURS en haut à gauche, le joueur en haut à droite. -->
  <header id="barre" class="barre" hidden>
    <button type="button" id="bouton-maison" class="bouton-rond" aria-label="Retour à la carte">
      <span aria-hidden="true">🏠</span>
    </button>
    <button type="button" id="bouton-joueur" class="bouton-rond bouton-joueur">
      <span id="joueur-avatar" class="avatar avatar-petit" aria-hidden="true"></span>
    </button>
  </header>

  <!-- ===== Écran 1 : « Qui joue ? » ===== -->
  <main id="ecran-qui-joue" class="ecran" hidden>
    <div class="carte">
      <p class="nom-appli">Aventure Éducative</p>
      <h1 tabindex="-1">Qui joue ?</h1>

      <!-- Lumo, la mascotte, et sa bulle (le dessin est ajouté par js/lumo.js) -->
      <div class="guide">
        <button type="button" class="lumo" aria-label="Lumo, la luciole"></button>
        <div class="bulle">
          <p id="consigne-qui-joue" class="bulle-texte" aria-live="polite"></p>
          <button type="button" class="bouton-ecouter" aria-label="Écouter Lumo"></button>
        </div>
      </div>

      <!-- La liste des joueurs est remplie par js/app.js -->
      <ul id="liste-profils" class="liste-profils"></ul>

      <button type="button" id="bouton-nouveau" class="bouton bouton-ajout">
        <span aria-hidden="true">＋</span> Nouveau joueur
      </button>
      <p id="message-complet" class="message" hidden>
        Il y a déjà 4 joueurs : c'est le maximum.
      </p>
    </div>
  </main>

  <!-- ===== Écran 2 : création d'un profil ===== -->
  <main id="ecran-creation" class="ecran" hidden>
    <!-- « novalidate » : c'est notre code qui vérifie la fiche,
         pour afficher des messages doux plutôt que ceux du navigateur -->
    <form id="formulaire-profil" class="carte" novalidate>
      <h1 tabindex="-1">Nouveau joueur</h1>

      <div class="question">
        <label for="prenom" class="titre-question">1. Ton prénom</label>
        <input id="prenom" name="prenom" type="text" maxlength="15"
               autocomplete="off" autocapitalize="words" spellcheck="false"
               class="champ-texte">
      </div>

      <fieldset class="question">
        <legend class="titre-question">2. Choisis ton image</legend>
        <!-- Les 8 images sont ajoutées par js/app.js -->
        <div id="choix-avatar" class="grille-avatars"></div>
      </fieldset>

      <fieldset class="question">
        <legend class="titre-question">3. Ton niveau</legend>
        <div id="choix-niveau" class="grille-niveaux"></div>
      </fieldset>

      <!-- Message d'aide si quelque chose manque (jamais en rouge) -->
      <p id="message-aide" class="message-aide" role="alert" hidden></p>

      <div class="actions">
        <button type="button" id="bouton-retour" class="bouton bouton-secondaire">Retour</button>
        <button type="submit" class="bouton bouton-principal">C'est parti !</button>
      </div>
    </form>
  </main>

  <!-- ===== Écran 3 : la carte des mondes (l'accueil du joueur) ===== -->
  <main id="ecran-carte" class="ecran ecran-carte" hidden>
    <div class="contenu-carte">
      <!-- Le titre et Lumo, côte à côte sur grand écran (gain de place pour la carte) -->
      <div class="entete-carte">
        <h1 id="carte-titre" tabindex="-1"></h1>
        <div class="guide">
          <button type="button" class="lumo" aria-label="Lumo, la luciole"></button>
          <div class="bulle">
            <p id="bulle-carte" class="bulle-texte" aria-live="polite">Choisis un monde !</p>
            <button type="button" class="bouton-ecouter" aria-label="Écouter Lumo"></button>
          </div>
        </div>
      </div>
      <!-- La carte au trésor : un cadre parchemin, la mer dessinée derrière,
           et les 9 îles posées dessus. Tout est fabriqué par js/app.js
           à partir de js/mondes.js. -->
      <div class="cadre-carte">
        <div class="carte-aventure">
          <div id="fond-mer" class="fond-mer" aria-hidden="true"></div>
          <ul id="liste-mondes" class="iles"></ul>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Écran 4 : un monde (pour l'instant, « Bientôt ! ») ===== -->
  <main id="ecran-monde" class="ecran ecran-monde" hidden>
    <div class="carte">
      <div id="monde-image" class="monde-image" aria-hidden="true"></div>
      <h1 id="monde-titre" tabindex="-1"></h1>
      <p class="sous-titre">Bientôt !</p>
      <div class="guide">
        <button type="button" class="lumo" aria-label="Lumo, la luciole"></button>
        <div class="bulle">
          <p id="bulle-monde" class="bulle-texte" aria-live="polite"></p>
          <button type="button" class="bouton-ecouter" aria-label="Écouter Lumo"></button>
        </div>
      </div>
    </div>
  </main>

  <!-- Le comportement de l'application, chargé en dernier.
       Les listes (profils, mondes) d'abord : app.js s'en sert. -->
  <script src="js/profils.js"></script>
  <script src="js/mondes.js"></script>
  <script src="js/dessins.js"></script>
  <script src="js/voix.js"></script>
  <script src="js/lumo.js"></script>
  <script src="js/sons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
